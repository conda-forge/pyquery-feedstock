{% set name = "pyquery" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 75238388750fc6e254b7a52f771027b9beb3a6202b88048bef52a00b0abeadbb

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - lxml >=2.1
    - cssselect >=1.2.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyquery

about:
  home: https://github.com/gawel/pyquery
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A jquery-like library for python
  description: |
    pyquery allows you to make jquery queries on xml documents. The API is as
    much as possible the similar to jquery. pyquery uses lxml for fast xml
    and html manipulation.
  doc_url: http://pyquery.rtfd.org
  dev_url: https://github.com/gawel/pyquery

extra:
  recipe-maintainers:
    - nehaljwani
