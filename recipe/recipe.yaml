schema_version: 1

context:
  version: 2.1.0

package:
  name: pyquery
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pyquery/pyquery-${{ version }}.tar.gz
  sha256: 75238388750fc6e254b7a52f771027b9beb3a6202b88048bef52a00b0abeadbb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - lxml >=2.1
    - cssselect >=1.2.0

tests:
  - python:
      imports:
        - pyquery
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A jquery-like library for python
  description: |
    pyquery allows you to make jquery queries on xml documents. The API is as
    much as possible the similar to jquery. pyquery uses lxml for fast xml
    and html manipulation.
  homepage: https://github.com/gawel/pyquery
  repository: https://github.com/gawel/pyquery
  documentation: http://pyquery.rtfd.org

extra:
  recipe-maintainers:
    - nehaljwani
    - jsmolic
